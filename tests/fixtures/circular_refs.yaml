openapi: 3.0.0
info:
  title: Circular Reference Test API
  version: 1.0.0
  description: API with circular references for testing

paths:
  /nodes:
    get:
      operationId: getNodes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

components:
  schemas:
    Node:
      type: object
      properties:
        value:
          type: string
          description: Node value
        children:
          type: array
          description: Child nodes (circular reference)
          items:
            $ref: '#/components/schemas/Node'
        parent:
          description: Parent node (circular reference)
          $ref: '#/components/schemas/Node'
