[project]
name = "responses-openapi"
description = "Add your description here"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    "openapi-core>=0.19.5",
    "responses>=0.25.8",
]

[dependency-groups]
test = [
    "behave>=1.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/responses_openapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/responses_openapi"]