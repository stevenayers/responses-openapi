[project]
name = "responses-openapi"
description = "Add your description here"
requires-python = ">=3.10,<3.13"
dynamic = ["version"]

dependencies = [
    "faker>=37.6.0",
    "hypothesis>=6.138.14",
    "openapi-core>=0.19.5",
    "openapi-schema-validator>=0.6.3",
    "openapi-spec-validator>=0.7.2",
    "pytest>=8.4.2",
    "responses>=0.25.8",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "coverage>=7.10.6",
    "bandit",
    "safety",
    "mypy>=1.11",
    "types-requests>=2.32.4.20250809",
    "types-pyyaml>=6.0.12.20250822",
    "pre-commit>=4.3.0",
    "ruff>=0.12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/responses_openapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/responses_openapi"]
